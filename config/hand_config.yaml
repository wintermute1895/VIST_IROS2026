# 灵巧手硬件配置
hardware:
  serial_port: "/dev/ttyUSB0"
  baudrate: 115200
  update_rate: 50 # Hz

# 关节映射 (Dex-Retargeting 弧度 -> 硬件数值)
# 格式: [min_rad, max_rad] -> [min_raw, max_raw]
mapping:
  index: 
    rad: [0.0, 1.57]
    raw: [0, 1000]
  middle:
    rad: [0.0, 1.57]
    raw: [0, 1000]
  ring:
    rad: [0.0, 1.57]
    raw: [0, 1000]
  thumb:
    rad: [0.0, 1.0]
    raw: [500, 2000] # 拇指通常比较特殊

# 安全限制
safety:
  max_current: 500 # mA