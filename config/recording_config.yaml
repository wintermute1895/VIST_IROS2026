# 数据录制配置文件
# 用于配置录制哪些话题，支持多层级数据采集

# 录制模式
recording_mode:
  # 可选: raw, processed, both
  # raw: 只录制原始输出（如 /left_arm_joint_control）
  # processed: 只录制处理后的数据（如 /robot1/left_arm/joint_follow）
  # both: 同时录制两者
  mode: "both"

# 话题配置
topics:
  # ========================================
  # 相机模块 (Camera)
  # ========================================
  camera_color_image:
    enabled: true  # 如果硬盘空间不足可设为 false
    topic: "/camera/color/image_raw"
    description: "RealSense 彩色图像原始数据 (640x480, 30Hz)"

  camera_depth_image:
    enabled: true  # 如果硬盘空间不足可设为 false
    topic: "/camera/depth/image_rect_raw"
    description: "RealSense 深度图像矫正后数据 (640x480, 30Hz)"

  camera_info:
    enabled: true
    topic: "/camera/color/camera_info"
    description: "相机标定信息和内参"

  # ========================================
  # 左臂外骨骼 (Exoskeleton Left Arm)
  # ========================================
  exo_left_raw:
    enabled: true
    topic: "/left_arm_joint_control"
    description: "左臂外骨骼传感器原始读数 (81.5Hz)"

  exo_left_filtered:
    enabled: true
    topic: "/filtered_left_joint_control"
    description: "左臂经过 VIST 滤波器处理后的数据 (80Hz)"

  # ========================================
  # 右臂外骨骼 (Exoskeleton Right Arm)
  # ========================================
  exo_right_raw:
    enabled: false
    topic: "/right_arm_joint_control"
    description: "右臂外骨骼传感器原始读数 (81.5Hz)"

  exo_right_filtered:
    enabled: false
    topic: "/filtered_right_joint_control"
    description: "右臂经过 VIST 滤波器处理后的数据 (80Hz)"

  # ========================================
  # 视觉控制 (Vision Control)
  # ========================================
  vision_left_raw:
    enabled: false
    topic: "/vision_left_joint_control"
    description: "左臂视觉算法计算的关节角度 (30Hz)"

  vision_right_raw:
    enabled: false
    topic: "/vision_right_joint_control"
    description: "右臂视觉算法计算的关节角度 (30Hz)"

  # ========================================
  # 灵巧手 (Dexterous Hand)
  # ========================================
  hand_left_control:
    enabled: true
    topic: "/cb_left_hand_control_cmd"
    description: "左手灵巧手控制指令"

  hand_left_state:
    enabled: true
    topic: "/cb_left_hand_state"
    description: "左手灵巧手状态反馈"

  hand_right_control:
    enabled: false
    topic: "/cb_right_hand_control_cmd"
    description: "右手灵巧手控制指令"

  hand_right_state:
    enabled: false
    topic: "/cb_right_hand_state"
    description: "右手灵巧手状态反馈"

  # ========================================
  # 机械臂驱动 - 左臂 (Robot Arm Driver - Left)
  # ========================================
  robot_left_joint_follow:
    enabled: true
    topic: "/robot1/left_arm/joint_follow"
    description: "左臂机械臂关节跟随指令 (经过桥接处理)"

  robot_left_joint_states:
    enabled: true
    topic: "/robot1/left_arm/joint_states"
    description: "左臂机械臂实际执行的关节角度反馈"

  robot_left_pose_states:
    enabled: true
    topic: "/robot1/left_arm/pose_states"
    description: "左臂机械臂末端位姿状态"

  # ========================================
  # 机械臂驱动 - 右臂 (Robot Arm Driver - Right)
  # ========================================
  robot_right_joint_follow:
    enabled: false
    topic: "/robot1/right_arm/joint_follow"
    description: "右臂机械臂关节跟随指令 (经过桥接处理)"

  robot_right_joint_states:
    enabled: false
    topic: "/robot1/right_arm/joint_states"
    description: "右臂机械臂实际执行的关节角度反馈"

  robot_right_pose_states:
    enabled: false
    topic: "/robot1/right_arm/pose_states"
    description: "右臂机械臂末端位姿状态"

  # ========================================
  # 全局状态 (Global States)
  # ========================================
  robot_joint_states_global:
    enabled: true
    topic: "/robot_joint_states"
    description: "机械臂全局关节状态（包含所有关节）"

  # ========================================
  # 性能监控 (Performance Metrics)
  # ========================================
  filter_performance:
    enabled: true
    topic: "/filter_performance"
    description: "VIST 滤波器性能指标（延迟、频率等）"

  vist_performance:
    enabled: true
    topic: "/vist_performance"
    description: "VIST 系统整体性能指标"

  vist_intent_factors:
    enabled: false
    topic: "/vist_intent_factors"
    description: "VIST 意图因子（距离、速度、对齐、冲突）"

# 评估配置
evaluation:
  # 评估哪个话题的数据
  # 可选: raw, processed, feedback
  target: "processed"

  # 是否对比多个话题
  compare_topics: true

  # 对比的话题列表（左臂为主）
  comparison_topics:
    - "/left_arm_joint_control"
    - "/filtered_left_joint_control"
    - "/robot1/left_arm/joint_follow"
    - "/robot1/left_arm/joint_states"

# 数据保存配置
output:
  # 保存目录
  base_dir: "data/recordings"

  # 是否保存原始rosbag
  save_rosbag: true

  # 是否生成评估报告
  generate_report: true

  # 是否生成可视化图表
  generate_plots: true

# 频率分析配置
frequency_analysis:
  # 是否进行频率分析
  enabled: true

  # 是否检测频率不一致
  check_consistency: true

  # 期望的频率范围
  expected_frequencies:
    exo_raw: [80, 85]  # Hz - 外骨骼原始数据
    exo_filtered: [75, 85]  # Hz - VIST 滤波后数据
    vision_raw: [28, 32]  # Hz - 视觉控制数据
    robot_feedback: [95, 105]  # Hz - 机械臂反馈
    camera: [28, 32]  # Hz - 相机数据
    hand_state: [95, 105]  # Hz - 灵巧手状态

# 数据质量检查
quality_checks:
  # 是否检查数据完整性
  check_completeness: true

  # 是否检查数据连续性
  check_continuity: true

  # 是否检查异常值
  check_outliers: true

  # 异常值阈值（标准差倍数）
  outlier_threshold: 3.0

# 注意：关节方向映射已移至控制配置
# 请在 external_sdk/arm_teleop/src/lbot_teleop/config/teleop_config.yaml 中配置
# 录制的数据是经过方向映射后的数据，不需要后处理
