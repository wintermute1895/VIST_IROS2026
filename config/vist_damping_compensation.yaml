# VIST 阻尼补偿配置
# Damping Compensation Configuration

damping_compensation:
  # 基础刚度（无冲突时的虚拟夹具强度）
  # Base stiffness (virtual fixture strength when no conflict)
  K_BASE: 100.0  # N/m

  # 基础阻尼（无冲突时的阻尼系数）
  # Base damping (damping coefficient when no conflict)
  D_BASE: 20.0   # N·s/m

  # 冲突阻尼增益（冲突时额外增加的阻尼）
  # Conflict damping gain (additional damping during conflict)
  K_DAMP: 50.0   # N·s/m

  # 最大阻尼力（饱和保护）
  # Maximum damping force (saturation protection)
  MAX_DAMPING_FORCE: 50.0  # N

  # 说明 / Notes:
  # - K_BASE 越大，吸附力越强（但可能导致震荡）
  #   Larger K_BASE = stronger attraction (but may cause oscillation)
  #
  # - D_BASE 越大，运动越平滑（但可能导致响应慢）
  #   Larger D_BASE = smoother motion (but may cause slow response)
  #
  # - K_DAMP 越大，冲突时阻尼越强（防止过冲）
  #   Larger K_DAMP = stronger damping during conflict (prevents overshoot)

  # 推荐范围 / Recommended ranges:
  # K_BASE: 50-200
  # D_BASE: 10-50
  # K_DAMP: 30-100

  # 临界阻尼条件（避免震荡）/ Critical damping condition:
  # D_BASE >= 2 * sqrt(K_BASE * m)  # m 为等效质量 / m is equivalent mass

  # 经验公式 / Empirical formula:
  # K_DAMP = 0.5 * K_BASE

# 速度测量配置
# Velocity measurement configuration
velocity_measurement:
  # 最小速度阈值（避免除零）
  # Minimum velocity threshold (avoid division by zero)
  min_velocity: 1.0e-6  # m/s

  # 速度滤波器类型
  # Velocity filter type
  filter_type: "one_euro"  # Options: "one_euro", "moving_average", "none"

  # 采样频率
  # Sampling frequency
  sampling_frequency: 30  # Hz

# 调试选项
# Debug options
debug:
  enable_logging: true
  log_stiffness: true
  log_damping: true
  log_forces: true
