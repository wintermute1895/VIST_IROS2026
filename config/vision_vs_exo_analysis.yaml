# 视觉控制 vs 遥操臂性能对比分析配置
# 用于对比视觉控制和遥操臂的性能指标

# 物理极限参数（用于离群点检测）
physical_limits:
  # 是否启用物理极限滤波
  enabled: false

  # LinkerArm机械臂的物理极限
  max_velocity: 3.14  # rad/s (约180°/s)
  max_acceleration: 15.0  # rad/s²
  max_jerk: 100.0  # rad/s³

  # 离群点检测阈值（倍数）
  velocity_threshold_multiplier: 1.5
  acceleration_threshold_multiplier: 2.0

  # 插值方法
  interpolation_method: 'cubic'

# 数据源配置
data_sources:
  # 视觉控制输出（高频250Hz）
  command:
    enabled: true
    topics:
      - /vision_control/joint_follow
    label: "视觉控制（250Hz+EMA）"
    color: "#2E86AB"  # 蓝色

  # 遥操臂输出（原始透传）
  exo_output:
    enabled: true
    topics:
      - /right_arm_joint_control
    label: "遥操臂输出（原始）"
    color: "#06A77D"  # 绿色

  # 真机反馈（如果有）
  feedback_raw:
    enabled: false
    topics:
      - /robot1/right_arm/joint_states
    label: "真机反馈"
    color: "#A23B72"  # 紫红色

  # 清洗后反馈（暂不使用）
  feedback_cleaned:
    enabled: false
    label: "真机反馈（清洗）"
    color: "#F18F01"  # 橙色

# 可视化配置
visualization:
  # 轨迹对比图
  trajectory_comparison:
    enabled: true
    show_command: true          # 视觉控制
    show_feedback_raw: false
    show_feedback_cleaned: false
    show_exo_output: true       # 遥操臂

  # 速度对比图
  velocity_comparison:
    enabled: true
    show_command: true
    show_feedback_raw: false
    show_feedback_cleaned: false
    show_exo_output: true

  # 加速度对比图
  acceleration_comparison:
    enabled: true
    show_command: true
    show_feedback_raw: false
    show_feedback_cleaned: false
    show_exo_output: true

  # Jerk对比图
  jerk_comparison:
    enabled: true
    show_command: true
    show_feedback_raw: false
    show_feedback_cleaned: false
    show_exo_output: true

  # 离群点检测可视化
  outlier_detection:
    enabled: false
    show_removed_points: false

  # 指标对比柱状图
  metrics_bar_chart:
    enabled: true
    metrics:
      - 'avg_velocity'
      - 'max_velocity'
      - 'avg_acceleration'
      - 'max_acceleration'
      - 'avg_jerk'
      - 'max_jerk'

# 输出配置
output:
  save_json: true
  save_plots: true
  dpi: 150
  format: 'png'