# 性能评估配置文件
# Performance Evaluation Configuration

# 指标开关配置
metrics_enabled:
  # 基础指标
  smoothness: true          # 平滑度指标（速度、加速度、jerk）
  accuracy: true            # 精度指标（需要目标轨迹）
  efficiency: true          # 效率指标（时长、路径长度）

  # 论文核心指标
  normalized_jerk: true     # 归一化Jerk
  sparc: true               # SPARC平滑度
  psd_high_freq: true       # PSD高频能量（>5Hz）
  dtw_distance: true        # DTW距离（需要多条轨迹）
  pca_task_axis: true       # PCA任务轴占比（需要任务定义）
  success_rate: true        # 成功率（需要成功标准）

# 指标计算参数
metric_params:
  # SPARC参数
  sparc:
    padlevel: 4             # 零填充级别
    fc: 10.0                # 最大截止频率（Hz）
    amp_th: 0.05            # 幅度阈值

  # PSD参数
  psd:
    sampling_rate: 30       # 采样率（Hz）
    nperseg: 256            # Welch方法的段长度
    freq_threshold: 5.0     # 高频阈值（Hz）

  # DTW参数
  dtw:
    radius: 10              # FastDTW搜索半径
    min_trajectories: 2     # 最少需要的轨迹数量

  # PCA参数
  pca:
    n_components: 7         # 主成分数量
    task_axes: [0, 1, 2]    # 任务相关的主成分索引

  # 成功率参数
  success_rate:
    position_threshold: 0.001   # 位置误差阈值（m，即1mm）
    duration_threshold: 0.5     # 持续时间阈值（s）
    goal_position: null         # 目标位置（如果为null则从数据推断）

# 可视化配置
visualization:
  enabled: true
  dpi: 300
  figsize: [15, 10]
  save_format: "png"

  # 绘制的图表
  plots:
    joint_angles: true
    velocity_profile: true
    acceleration_profile: true
    jerk_profile: true
    psd_spectrum: true      # PSD频谱图
    trajectory_3d: true     # 3D轨迹图（需要末端位置）

# 报告配置
report:
  format: "json"            # json, yaml, markdown
  include_raw_data: false   # 是否包含原始数据
  decimal_places: 4         # 小数位数