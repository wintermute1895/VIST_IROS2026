# VIST/config/task.yaml

# 任务目标定义
target:
  # 孔位的世界坐标 (x, y, z)
  hole_position: [0.5, 0.0, 0.25]
  
  # 孔位的姿态四元数 (x, y, z, w) - 假设孔垂直向上
  hole_orientation: [0.0, 0.7071, 0.0, 0.7071]

# 意图推断阈值 [cite: 50-59]
intent:
  # 距离阈值 (米): 小于此距离开始进入精密模式
  distance_threshold: 0.15
  
  # 速度阈值 (m/s): 小于此速度开始判断为有意对准
  velocity_threshold: 0.08

# 估计器参数 [cite: 64-66]
estimator:
  dt: 0.01
  # R_human 放大倍率 (gamma1)
  human_noise_scale: 50.0
  # R_virtual 衰减速率 (gamma2)
  virtual_trust_scale: 20.0