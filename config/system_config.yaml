# VIST System Configuration
# 系统配置文件 - 统一管理所有参数

# ==========================================
# 机器人模型参数
# ==========================================
robot_model:
  # URDF 文件路径（相对于 config 目录）
  urdf_file: "urdf/lkls73_o2_dual_arm_description.urdf"  # FSM 专用 URDF（修改了 Elbow_Pitch 和 Wrist_Pitch 的关节方向）

  # 末端执行器名称
  end_effector_frames:
    left: "Left_Wrist_Roll_Link"
    right: "Right_Wrist_Roll_Link"

  # 肘部关节名称（用于几何求解器）
  elbow_frames:
    left: "Left_Elbow_Pitch_Link"
    right: "Right_Elbow_Pitch_Link"

# ==========================================
# 机器人参数
# ==========================================
robot:
  # 肩部位置（相对于 body_base_link）
  # 调整到第二个关节位置，使肩部向量更好地与机器人第一个关节向量平行重合
  shoulder_position: [0.0, -0.17, 1.217]  # [x, y, z] in meters

  # 臂长参数
  arm_lengths:
    upper: 0.2908    # 上臂长度 (meters)
    forearm: 0.2366  # 前臂长度 (meters)

  # 关节限位
  joint_limits:
    - [-7, 7]      # Joint 0: Shoulder_Pitch
    - [-7, 7]     # Joint 1: Shoulder_Roll
    - [-7, 7]    # Joint 2: Shoulder_Yaw
    - [-7, 7]     # Joint 3: Elbow_Pitch
    - [-3.14, 3.14]    # Joint 4: Wrist_Yaw
    - [-3.14, 3.14]    # Joint 5: Wrist_Pitch
    - [-3.14, 3.14]    # Joint 6: Wrist_Roll

  # 关节方向系数（用于调整电机旋转方向）
  # 1 = 正向, -1 = 反向
  # 在真机测试时可以方便地调整每个关节的旋转方向
  joint_directions:
    - -1  # Joint 0: Shoulder_Pitch (反向)
    - 1   # Joint 1: Shoulder_Roll
    - -1  # Joint 2: Shoulder_Yaw (反向)
    - 1  # Joint 3: Elbow_Pitch (反向，让角度映射正确)
    - 1   # Joint 4: Wrist_Yaw
    - 1  # Joint 5: Wrist_Pitch (反向)
    - 1   # Joint 6: Wrist_Roll

  # 关节零位偏移（单位：弧度）
  # 用于调整每个关节的零位定义，使人体中立姿态对应机器人零位
  # 计算公式: q_final = q_calculated * joint_directions[i] + joint_offsets[i]
  # 说明：URDF中J0=0°已经对应手臂下垂，不需要额外偏移
  joint_offsets:
    - 0.0      # Joint 0: Shoulder_Pitch (URDF的0°已经是下垂姿态)
    - 0.0      # Joint 1: Shoulder_Roll
    - 0.0      # Joint 2: Shoulder_Yaw
    - 0.0      # Joint 3: Elbow_Pitch
    - 0.0      # Joint 4: Wrist_Yaw
    - 0.0      # Joint 5: Wrist_Pitch
    - 0.0      # Joint 6: Wrist_Roll

  # 关节使能配置（用于单关节测试和调试）
  # true = 关节跟随控制命令运动
  # false = 关节锁定在初始位置不动
  # 用途：逐个测试关节映射是否正确
  joint_enabled:
    - true   # Joint 0: Shoulder_Pitch
    - true   # Joint 1: Shoulder_Roll
    - true   # Joint 2: Shoulder_Yaw
    - true   # Joint 3: Elbow_Pitch
    - false   # Joint 4: Wrist_Yaw
    - false   # Joint 5: Wrist_Pitch
    - false   # Joint 6: Wrist_Roll

# ==========================================
# 坐标系转换
# ==========================================
coordinate_transform:
  # 转换矩阵：Shoulder Frame → Robot Base Frame
  # 用户和机器人同向放置（不是面对面）
  rotation_matrix: [
    [0,  0,  1],  # X_robot = -Z_shoulder (前 = -前，修正镜面对称)
    [0, -1,  0],  # Y_robot = -Y_shoulder (左 = -右)
    [1,  0,  0]   # Z_robot = X_shoulder (上 = 上)
  ]

  # TCP偏移（Tool Center Point Offset）
  # 从末端法兰盘到工具末端（如USB插头尖端）的偏移
  # 格式: [x, y, z, rx, ry, rz]
  # - x, y, z: 平移偏移（米）
  # - rx, ry, rz: 旋转偏移（弧度，可选，默认为0）
  tcp_offset: [0.0, 0.0, 0.15]  # USB沿Z轴延伸15cm（需要实际测量）

  # 坐标系说明
  shoulder_frame:
    description: "Vision node output (relative to shoulder)"
    axes:
      x: "up (vertical)"
      y: "right (horizontal)"
      z: "forward (toward camera)"

  robot_base_frame:
    description: "Robot base coordinate system (body_base_link)"
    axes:
      x: "forward"
      y: "left"
      z: "up"

# ==========================================
# 控制参数
# ==========================================
control:
  # IK 策略选择
  # 可选值: "differential" (微分IK), "pink" (Pink优化器), "vist" (VIST卡尔曼滤波)
  ik_strategy: "vist"

  # 微分 IK 参数
  ik_gain: 0.5  # 增益系数 (0-1)，降低以获得更平滑的运动
  ik_damping: 1e-1  # 阻尼系数（避免奇异点，增加以减少跳变）
  ik_max_iter: 100  # 最大迭代次数
  ik_tolerance: 2e-3  # 收敛阈值（米）= 2mm（平衡精度和稳定性）

  # Pink IK 参数（当 ik_strategy="pink" 时使用）
  pink_dt: 0.02  # Pink 求解器时间步长
  pink_wrist_priority: 1.0  # 手腕任务优先级（高）
  pink_elbow_priority: 0.5  # 肘部任务优先级（中）

  # 速度和加速度限制
  # ✅ 2026-02-22: 只放宽J2的限制（因为只有J2触发问题）
  # 其他关节保持保守限制以确保安全
  # 单位：rad/s
  max_joint_velocity: [0.7, 1.5, 1.5, 0.5, 0.5, 0.5, 0.5]  # J0-J6的速度限制
  # J0, J1, J3-J6: 0.5 rad/s (29度/秒) - 保守限制
  # J2 (Shoulder_Yaw): 1.5 rad/s (86度/秒) - 放宽限制，因为这个关节经常触发

  # 加速度限制（单位：rad/s²）
  max_joint_acceleration: [0.8, 1.5, 1.5, 0.8, 0.8, 0.8, 0.8]  # J0-J6的加速度限制
  # J0, J1, J3-J6: 0.8 rad/s² (46度/秒²) - 保守限制
  # J2: 3.0 rad/s² (172度/秒²) - 放宽限制

  # 速度估计方法（用于消融实验）
  # 选项：
  #   "kalman": 使用VIST卡尔曼滤波器的速度估计（推荐）
  #   "numerical": 使用数值微分估计速度（基线方法）
  #   "measured": 使用机器人SDK返回的速度测量值（如果可用）
  velocity_estimation_method: "kalman"  # 默认使用卡尔曼滤波

  # VIST输出低通滤波器参数
  # 用于平滑VIST输出，减少跳变，降低SafeRobotController触发频率
  # alpha ∈ [0, 1]: 平滑系数
  #   - 1.0: 无滤波（直接输出）
  #   - 0.5: 中等平滑
  #   - 0.2: 强平滑（推荐，用于抑制跳变）
  #   - 0.1: 非常强的平滑（可能导致响应迟钝）
  vist_output_filter_alpha: 0.2  # 推荐值：0.2（强平滑）

  # 意图因子模式（用于消融实验）
  # 选项：
  #   "dynamic": 根据任务状态动态计算 α（推荐，VIST完整功能）
  #   "fixed": 固定 α 为指定值（用于消融实验）
  intent_factor_mode: "fixed"  # 使用固定α模式（回放时没有视觉数据）
  fixed_alpha_value: 1.0  # α=1.0: 高意图，最小滤波，最大响应性

  # 控制频率
  # 使用固定频率限制，减少高频振荡
  # ✅ 2026-02-22: 降低到实际可达到的频率（真机实际约18-20 Hz）
  frequency: 20  # Hz (从26降到20，匹配真机实际频率)
  dt: 0.05       # 1/frequency (seconds) - 从0.0385改为0.05

  # 遥操作时长
  duration: 300.0  # seconds (5 minutes)

  # 双目标 IK 权重（用于 differential IK）
  wrist_weight: 1.0   # 手腕权重
  elbow_weight: 0.5   # 肘部权重

# ==========================================
# VIST 卡尔曼滤波参数
# ==========================================
vist_kalman:
  # 启用 VIST 卡尔曼滤波（当 ik_strategy="vist" 时生效）
  enabled: true

  # 仿真参数覆盖模式
  # 当启用时，VIST将使用ParameterOverrideManager中的参数而不是从视觉数据计算
  # 这允许在没有相机输入的情况下测试完整的VIST控制器效果
  # ⚠️ 真机测试时应设为 false，让 α 动态计算
  simulation_use_parameter_override: false  # 关闭参数覆盖，启用动态意图检测

  # 几何解析求解器（肘部约束集成）
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # geometric_solver:
  #   enabled: true  # 启用几何解析求解器 - 追求构型一致性
  #   # 当启用时，VIST 将使用几何解析解计算臂部配置（q1-q4）
  #   # 优势：
  #   # - 解析解速度快（10-100x）
  #   # - 配置唯一且自然
  #   # - 符合人体运动学
  #   # - 直接追求方向向量一致性，末端位置自然对齐
  #   trust_weight: 2.0  # 几何解析解的信任权重（相对于微分IK）
  #                      # 通过调整 Q 矩阵实现：Q_arm *= (1.0 / trust_weight)
  #
  #   # 禁用微分IK（只使用几何求解器）
  #   disable_differential_ik: true  # 设置为true时，完全禁用微分IK，只使用几何求解器
  #                                   # 卡尔曼滤波仍然会对几何求解器的输出进行平滑处理
  #
  #   # 腕部控制模式（4+3解耦策略）
  #   # 腕部控制模式
  #   # - full_dof: 全自由度（J5/J6/J7完全跟随人手姿态）
  #   # - constrained_horizontal: 约束水平模式（J5锁定，J6保持水平，J7跟随）
  #   # - wrist_locked: 腕部锁定（J5/J6/J7全部锁定为0）
  #   # - vertical_insertion: 垂直插入模式（J5/J7锁定，J6动态约束保持垂直向下）
  #   #   * 适用于USB插入等精密垂直插入任务
  #   #   * J1+J4+J6协同工作保持末端垂直
  #   #   * 避免姿态自由度带来的插入偏差
  #   wrist_control_mode: "wrist_locked"  # 推荐用于USB插入任务
  #
  #   # 动态腕部控制：在精密插入阶段自动解锁腕部
  #   enable_dynamic_wrist_unlock: true  # 当α > 0.8时，自动切换到full_dof模式
  #
  #   # 模式说明：
  #   # - full_dof: 全自由度欧拉角分解（默认）
  #   #   * J5-J7通过欧拉角分解自动匹配目标姿态
  #   #   * 适合通用遥操作任务和精密插入阶段
  #   # - constrained_horizontal: 约束水平模式（推荐用于桌面操作）
  #   #   * J5 (Wrist Yaw): 锁定为0（保持水平）
  #   #   * J6 (Wrist Pitch): 与J4配合约束，保持末端水平于桌面
  #   #   * J7 (Wrist Roll): 从目标姿态提取手腕旋转
  #   #   * 适合插入、抓取等桌面操作任务
  #   #   * 注意：启用dynamic_wrist_unlock后，在精密插入阶段会自动切换到full_dof
  #   # - wrist_locked: 腕部锁定模式
  #   #   * J5-J7全部锁定为0
  #   #   * 只控制臂部配置（J1-J4），末端姿态固定
  #   #   * 适合简单的位置追踪任务

  # 仿生多任务观测模型（3+4解耦）
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # biomimetic_observation:
  #   enabled: false  # 禁用仿生观测 - 避免与几何求解器冲突
  #   # 仿生观测使用增量控制 + 微分IK，会与几何求解器的直接求解冲突
  #   # 几何求解器追求构型一致性，更纯粹、更直接
  #   # 当启用时，VIST 将人体运动分解为三个独立任务：
  #   # 1. 手部任务：末端位置追踪
  #   # 2. 肘部任务：J4角度模仿
  #   # 3. 臂平面任务：J1-J3姿态模仿
  #   # 这是VIST的"完全体"：从位置追踪器进化为构型复现器
  #   elbow_weight: 0.3   # 肘部角度任务权重（0-1）
  #   swivel_weight: 0.2  # 臂平面任务权重（0-1）
  #   # 权重说明：
  #   # - 0.0: 完全忽略该任务，只追踪手部位置
  #   # - 1.0: 完全模仿人体构型，可能牺牲手部精度
  #   # - 0.4-0.5: 构型优先，平衡位置精度和构型自然度（当前配置）
  #   # - 0.2-0.3: 位置优先，构型自然度次之

  # 状态空间维度
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # n_joints: 7  # 关节数量
  # state_dim: 14  # 状态维度 = 2 * n_joints (位置 + 速度)

  # 过程模型参数（恒速模型）
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # process_model:
  #   dt: 0.0125  # 时间步长（秒），对应 80Hz
  #
  #   # 过程噪声协方差 Q（各向异性）
  #   position_variance: 1e-5  # 关节角度方差
  #   velocity_variance: 1e-4  # 关节速度方差
  #
  #   # 肘部约束（防止 7-DoF 肘部漂移）
  #   elbow_joint_indices: [3]  # 肘部关节索引
  #   elbow_damping_factor: 0.1  # 肘部方差衰减因子（0-1，越小越稳定）

  # 观测模型参数
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # observation_model:
  #   # 姿态控制开关（李代数支持）
  #   use_orientation_control: false  # 是否使用姿态控制（默认false，只控制位置）
  #   # 说明：
  #   # - false: 只使用位置控制（3D雅可比），适合USB插入等位置主导任务
  #   # - true: 使用位置+姿态控制（6D雅可比 + 李代数），适合需要精确姿态的任务
  #   # 当启用时，系统将：
  #   # 1. 使用李代数 log_SO3 计算姿态误差（避免欧拉角奇异性）
  #   # 2. 通过完整的 6D 雅可比矩阵转换到关节空间
  #   # 3. 保持关节空间 Kalman 滤波的优势
  #
  #   # ==========================================
  #   # 多源融合方法选择
  #   # ==========================================
  #   # 可选值: "standard" (标准卡尔曼) 或 "information" (信息滤波器)
  #   fusion_method: "standard"  # 默认使用标准卡尔曼滤波
  #   # 说明：
  #   # - standard: 观测向量堆叠 z = [z_human; z_virtual]
  #   # - information: 信息滤波器形式 R_eff = (R_h^{-1} + R_v^{-1})^{-1}
  #   #                合成观测 z_syn = R_eff(R_h^{-1}z_h + R_v^{-1}z_v)
  #
  #   # 人类指令观测噪声 R_human（意图驱动）
  #   # 论文3.0版本：指数形式 R_human(α) = R_base × exp(λα)
  #   human_base_variance: 1e-3  # 基础噪声水平 R_base（收缩：5e-2 → 1e-4，建立对观测的信任）
  #   human_max_variance: 1e-1   # 最大噪声（自由移动时，仅用于兼容旧版本）
  #   human_lambda: 3.0          # 指数增长系数 λ（论文3.0版本新增）
  #
  #   # 虚拟引导观测噪声 R_virtual（微分 IK）
  #   # 论文3.0版本：反比例形式 R_virtual(α) = R_min/(α + ε) + γ_c × conflict
  #   virtual_base_variance: 1e-4  # 基础噪声水平（仅用于兼容旧版本）
  #   virtual_min_variance: 1e-4   # 最小噪声 R_min（收缩：1e-3 → 1e-4，建立对观测的信任）
  #   conflict_gain: 1.0           # 冲突增益 γ_c（论文3.0版本新增）
  #
  #   # 微分 IK 参数
  #   differential_ik_damping: 0.05  # 雅可比伪逆阻尼

  # 意图检测参数
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # intent_detection:
  #   # 意图因子 α ∈ [0, 1]
  #   # α → 0: 自由移动模式（强力去噪）
  #   # α → 1: 精密操作模式（磁吸引导）
  #
  #   # ==========================================
  #   # 论文英文草稿v1.0完整实现 (Eq. 2-5)
  #   # ==========================================
  #   # α_geo = exp(-1/2 ξ_err^T W_task ξ_err)  [几何势能]
  #   # α_vel = 1/(1 + β||ξ_vel||²)             [运动能量]
  #   # α_dir = 1/2(1 + cos(θ))                 [方向对齐]
  #   # α_k = σ(w_g·α_geo + w_v·α_vel) · (α_dir)^η  [意图因子]
  #
  #   # 任务流形度量张量 W_task (对角矩阵)
  #   # 对不同维度赋予不同权重 [x, y, z, rx, ry, rz]
  #   # 🔧 调整：降低权重以增加误差容忍度，使系统更柔顺
  #   w_task: [5.0, 5.0, 5.0, 0.5, 0.5, 0.5]  # 从 [10, 10, 10, 1, 1, 1] 降低到 [5, 5, 5, 0.5, 0.5, 0.5]
  #
  #   # 运动能量参数 β (Eq. 3)
  #   # α_vel = 1/(1 + β||ξ_vel||²)
  #   # 🔧 调整：降低β值，使速度因子对速度变化更不敏感，增加平滑性
  #   alpha_beta: 0.25  # 从 1.0 降低到 0.5
  #
  #   # 意图因子融合权重 (Eq. 5)
  #   # α_k = σ(w_g·α_geo + w_v·α_vel) · (α_dir)^η
  #   # 🔧 调整：平衡几何势能和速度权重
  #   w_geo: 0.5  # 几何势能权重
  #   w_vel: 0.5  # 速度权重
  #   # 🔧 调整：降低方向对齐指数，减少不确定方向的影响
  #   alpha_alignment_power: 1.0  # 从 2.0 降低到 1.0（线性而非二次方）
  #
  #   # 意图平滑
  #   # 🔧 调整：降低平滑系数，使α值变化更灵敏
  #   intent_smoothing: 0.95  # 70% 历史 + 30% 当前
  #
  #   # ==========================================
  #   # 旧版参数（保留用于向后兼容）
  #   # ==========================================
  #   alpha_computation_method: "paper"  # 已废弃，现在总是使用论文方法
  #   distance_threshold: 0.1
  #   velocity_threshold: 0.05
  #   sigmoid_k: 10.0
  #   sigma_d: 0.1
  #   beta_v: 20.0
  #   alpha_weights:
  #     distance: 0.3
  #     velocity: 0.3
  #     alignment: 0.4

  # ==========================================
  # 任务空间方差参数 (Task Space Covariance)
  # ==========================================
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # task_covariance:
  #   # α = 0 时的自由探索方差 (对应论文 Sigma_free)
  #   # 值越大，系统越信任人的输入，手感越轻盈
  #   free_variance_xyz: [0.001, 0.001, 0.001]     # [X, Y, Z] 自由平移方差
  #   free_variance_rpy: [0.5, 0.5, 0.1]     # [Rx, Ry, Rz] 自由旋转方差
  #
  #   # α = 1 时的约束方差 (对应论文 Sigma_cons，决定"粘滞感")
  #   # ⚠️ 绝对不能设为 0！设为小正数以保留人的横向微调能力
  #   cons_variance_xyz: [0.00001, 0.00001, 0.00001]   # [X, Y, Z] 约束平移方差。XY 放宽到 0.01，Z 轴(插入方向)保持大方差
  #   cons_variance_rpy: [0.0001, 0.0001, 0.0001]  # [Rx, Ry, Rz] 约束旋转方差

  # ==========================================
  # 圆柱形触发约束 (Cylinder Gating)
  # ==========================================
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # gating:
  #   # 只有当末端距离目标孔位的 Z 轴高度小于此值时，才允许意图因子 α > 0
  #   # 避免在半空中(XY对准但高度还很高时)提前触发方差坍缩导致锁死
  #   z_activation_threshold: 0.05  # 单位：米 (比如距离目标孔面 5cm 处开始启动粘滞感)
  #
  #   # 主动门控方向因子 (α_dir) 的避死锁容差 (对应论文公式6中的 ε)
  #   # 防止分母为 0，同时调节撤退时的灵敏度
  #   dir_epsilon: 1e-4

  # ==========================================
  # 速度与接触感知参数 (Velocity Perception)
  # ==========================================
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # velocity_perception:
  #   # 由于低成本硬件的微分速度极其抖动，必须在此设置一个速度截断或平滑阈值
  #   velocity_noise_floor: 1e-3  # 低于此速度视为静止，防止编码器量化噪声引起 α_vel 误触发
  #   # 虚拟接触判定的最大允许速度 (超过此速度强行认为没发生接触)
  #   max_valid_velocity: 0.5     # 单位：m/s

  # ==========================================
  # 卡尔曼滤波器系统参数 (Filter System)
  # ==========================================
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # filter_system:
  #   # 过程噪声极小值兜底 (对应论文公式10的 ε)
  #   # 防止协方差矩阵 Q_k 在长时间约束模式下彻底退化为不可逆矩阵
  #   process_noise_epsilon: 1e-6
  #
  #   # 算法运行频率 (对应 Δt)
  #   # 必须显式传入，以确保公式(10)中的运动学积分 (Δt^3/3, Δt^2/2) 量纲正确
  #   dt: 0.0125  # 80Hz 对应 0.0125s

  # 初始化参数
  # ⚠️ 未使用 - vist_kalman_filter.py v3.0 不读取此配置
  # initialization:
  #   initial_state_variance: 5e-2  # 初始状态不确定性
  #   initial_velocity_variance: 1e-3  # 初始速度不确定性

# ==========================================
# 滤波参数
# ==========================================
filtering:
  # Mapper 层滤波开关
  # true: 在 Mapper 中应用滤波（调试模式，方便可视化）
  # false: 透传原始数据给控制节点（生产模式，由 VIST 核心算法处理）
  enable_mapper_filter: true  # 重新启用Mapper滤波

  # Mapper 滤波器类型
  # 可选值: "ema" (指数移动平均) 或 "oneeuro" (One Euro Filter)
  mapper_filter_type: "oneeuro"

  # EMA 滤波参数
  ema_alpha: 0.5  # 滤波系数 (0=最大平滑, 1=无滤波)

  # One Euro Filter 参数
  oneeuro_min_cutoff: 0.04  # 最小截止频率（降低以增强滤波，减少目标变化率）
  oneeuro_beta: 0.0003      # 速度系数（降低以减少对速度变化的敏感度）
  oneeuro_d_cutoff: 1.0    # 导数截止频率

  # 控制节点滤波（VIST 核心算法）
  # 这里可以配置 Kalman Filter 或其他状态估计器参数
  enable_control_filter: true
  control_filter_type: "oneeuro"  # 控制节点使用的滤波器

# ==========================================
# 网络参数
# ==========================================
network:
  udp_host: "0.0.0.0"  # 绑定地址（0.0.0.0 = 所有接口）
  udp_ip: "127.0.0.1"  # 发送地址
  udp_port: 6001
  buffer_size: 65536

# ==========================================
# 视觉参数
# ==========================================
vision:
  # 相机参数 - 平衡模式（RealSense 原生分辨率，更好的深度精度）
  width: 848
  height: 480
  fps: 30

  # 坐标缩放
  scale: 1.0

  # 深度融合
  use_realsense_depth: true
  depth_valid_threshold: 0.001  # meters

# ==========================================
# 安全参数
# ==========================================
safety:
  # 数据超时
  max_data_timeout: 50  # frames (1秒 @ 50Hz)

  # 位置限制
  max_distance_from_shoulder: 0.7  # meters (1.2 * arm_length)

  # 调试模式
  debug_mode: false
  debug_print_interval: 30  # frames

# ==========================================
# 真机驱动参数
# ==========================================
hardware:
  # 机器人控制器 IP 地址
  robot_ip: "192.168.10.21"

  # 使用哪个手臂
  arm_side: "left"  # "left" 或 "right" - 修改为 left 以匹配 baseline_filters_config.yaml

  # 关节映射关系（URDF ↔ SDK）
  joint_mapping:
    urdf_to_sdk: [0, 1, 2, 3, 4, 5, 6]
    sdk_to_urdf: [0, 1, 2, 3, 4, 5, 6]

  # 关节符号翻转（已弃用 - 统一使用 robot.joint_directions）
  # joint_sign_flip: [false, false, false, false, false, false, false]

  # SDK 运动控制参数
  # 针对重负载末端优化：进一步降低以减少振荡
  # 注意：由于joint_follow有bug，只能使用move_joint
  move_joint_speed: 0.5     # 关节运动速度 (rad/s) - 更慢更稳定
  move_joint_accel: 0.8     # 关节运动加速度 (rad/s²) - 更平滑的启停
  move_joint_block: false   # 是否阻塞等待运动完成（非阻塞模式 + 状态同步修复）

  # 关节跟随模式（用于遥操作）
  joint_follow_mode: false    # true=高跟随模式（低延迟），false=低跟随模式（平滑）

  # 连接超时
  connection_timeout: 10.0   # 秒

  # 状态读取重试次数
  state_read_retries: 5
  state_read_interval: 0.5   # 秒

# ==========================================
# 可视化参数
# ==========================================
visualization:
  # 是否启用可视化
  enable: false

  # MeshCat 服务器地址
  meshcat_url: "tcp://127.0.0.1:7000"

  # 更新频率
  update_rate: 30  # Hz

  # 轨迹点数量
  max_trajectory_points: 100

# ==========================================
# 增强功能配置（新增 2026-02-09）
# ==========================================
enhanced_features:
  # 是否启用意图检测和冲突检测
  # true: 启用增强模式（5阶段状态机 + 冲突检测 + 柔顺接管）
  # false: 基础模式（直接运动映射，向后兼容）
  enable_intent_detection: false

  # 是否启用目标检测（AprilTag/ArUco）
  enable_target_detection: false

  # 目标检测器类型
  target_detector_type: "apriltag"  # "apriltag" 或 "aruco"

  # 最大速度限制（用于简化安全监控器）
  max_velocity: 0.10  # 10 cm/s

# ==========================================
# 数据记录和性能监控
# ==========================================
data_logging:
  # 是否启用数据记录（仿真和真机通用）
  enable_logging: true

  # 实验名称（可选，留空则自动生成）
  experiment_name: ""

  # 数据保存目录
  data_dir: "data/experiments"

  # 是否启用性能监控
  enable_performance_monitoring: true

  # 是否录制相机数据
  enable_camera_recording: false

  # 相机话题列表（当 enable_camera_recording=true 时录制）
  camera_topics:
    - "/camera/color/image_raw"
    - "/camera/depth/image_raw"
    - "/camera/color/camera_info"
    - "/hand_pose"


# ============================================
# 视觉控制测试配置（2026-02-24添加）
# ============================================

# ROS2发布配置
simulation_enable_ros2_publish: true

# 简单滤波器配置（EMA）
enable_simple_filter: true
simple_filter_alpha: 0.3  # 推荐值: 0.2-0.4

# 高频发布配置
high_freq_publish_enabled: true
high_freq_interpolation: "linear"  # "linear" 或 "cubic"

# ============================================
# 启动配置 (Startup Configuration)
# ============================================
startup:
  # 外骨骼配置
  exoskeleton:
    package: "linkerta"
    node: "linkerta_node"
    publish_left: false
    publish_right: true

  # 滤波器配置
  filter:
    type: "one_euro"  # none, ema, one_euro, vist_kalman
    input_topic: "/right_arm_joint_control"
    output_topic: "/filtered_right_joint_control"
    performance_topic: "/filter_performance"

    # 滤波器参数
    ema_alpha: 0.3
    one_euro_min_cutoff: 1.0
    one_euro_beta: 0.007
    one_euro_d_cutoff: 1.0

  # 机械臂驱动配置
  robot_driver:
    package: "lbot_driver"
    node: "lbot_driver"
    config_file: "src/lbot_driver/config/lbot_config.yaml"
    workspace: "/home/ilex/Dev/VIST/external_sdk/arm_teleop"

  # 遥操作桥接配置
  teleop_bridge:
    package: "lbot_teleop"
    node: "teleop_bridge_node"
    config_file: "src/lbot_teleop/config/teleop_bridge_params.yaml"
    workspace: "/home/ilex/Dev/VIST/external_sdk/arm_teleop"

    # 话题和服务重映射
    remapping:
      topics:
        - from: "/robot1/right_arm/joint_follow"
          to: "/right_arm/joint_follow"
      services:
        - from: "/robot1/right_arm/move_joint"
          to: "/right_arm/move_joint"

  # 启动前检查
  pre_checks:
    check_robot_connection: true
    check_exoskeleton_device: false  # 设为false避免阻塞
    check_topic_collision: true
    check_ros_environment: true

  # 相机配置
  camera:
    enabled: false  # 是否启用相机数据采集
    package: "camera_manager"
    node: "data_camera_node"

    # 相机参数
    width: 848
    height: 480
    fps: 30

    # 相机序列号（用于区分多个相机）
    # 机器人头顶相机（用于数据采集和意图因子计算）
    serial_number: "348122071157"  # 序列号以7结尾的相机

    # 发布的话题
    topics:
      color_image: "/camera/color/image_raw"
      depth_image: "/camera/depth/image_raw"
      camera_info: "/camera/color/camera_info"
      hand_pose: "/hand_pose"  # 如果有手部姿态估计

    # 多相机配置说明
    # 当前系统有两个 D435i 相机:
    # - 348122071157 (末位7): 机器人头顶相机，用于数据采集和意图计算
    # - 327122074150 (末位0): 备用相机

  # 意图计算配置
  intent_calculation:
    enabled: false  # 是否启用意图计算

    # 各项因子计算开关
    compute_alpha_geo: true   # 计算几何距离因子
    compute_alpha_vel: true   # 计算速度因子
    compute_alpha_dir: true   # 计算方向因子

    # ArUco标定码参数
    aruco:
      enabled: true  # 是否启用ArUco检测（如果禁用则跳过手部位置检测）
      dict_type: "DICT_4X4_50"  # ArUco字典类型
      marker_size: 0.05  # 标定码尺寸（米）

    # 手部偏移（相对于标定码的偏移，米）
    hand_offset:
      x: 0.0
      y: 0.0
      z: 0.1  # 手部在标定码上方10cm

    # 目标位置（任务目标，米）
    target_position:
      x: 0.42
      y: -0.11
      z: 0.747

    # 发布的话题
    topics:
      intent_factors: "/intent_factors"  # 意图因子 [α, α_geo, α_vel, α_dir]
      debug_image: "/intent_debug_image"  # 调试图像

  # 数据手套配置
  data_glove:
    enabled: false  # 是否启用数据手套
    package: "linkerhand_retarget"
    node: "handretarget"
    workspace: "/home/ilex/Downloads/ros-teleop"

    # USB 设备配置
    usb_device: "/dev/ttyUSB0"  # 默认 USB 设备
    auto_detect: true  # 自动检测第一个可用的 ttyUSB 设备

    # 标定模式
    calibration_mode: false  # true=强制标定, false=正常运行

    # 发布的话题
    topics:
      control_cmd: "/cb_right_hand_control_cmd"  # 手部控制命令
      state: "/cb_right_hand_state"  # 手部状态反馈

  # 灵巧手配置
  dexterous_hand:
    enabled: false  # 是否启用灵巧手
    package: "linker_hand_ros2_sdk"
    node: "linker_hand_advanced_l10"
    workspace: "/home/ilex/Downloads/linkerhand-ros2-sdk-main"

    # CAN 总线配置
    can_port: "can0"
    can_bitrate: 1000000  # 1 Mbps

    # 手部类型
    hand_type: "right"  # "left" 或 "right"

    # 触觉传感器
    enable_touch: false  # 是否启用触觉传感器

    # 订阅的话题
    topics:
      control_cmd: "/cb_right_hand_control_cmd"  # 接收手部控制命令
      state: "/cb_right_hand_state"  # 发布手部状态
