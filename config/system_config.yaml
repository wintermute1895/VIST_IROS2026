# VIST System Configuration
# 系统配置文件 - 统一管理所有参数

# ==========================================
# 机器人模型参数
# ==========================================
robot_model:
  # URDF 文件名
  urdf_file: "lkls73_o2_dual_arm_description.urdf"

  # 末端执行器名称
  end_effector_frames:
    left: "Left_Wrist_Roll_Link"
    right: "Right_Wrist_Roll_Link"

  # 肘部关节名称（用于几何求解器）
  elbow_frames:
    left: "Left_Elbow_Pitch_Link"
    right: "Right_Elbow_Pitch_Link"

# ==========================================
# 机器人参数
# ==========================================
robot:
  # 肩部位置（相对于 body_base_link）
  # 调整到第二个关节位置，使肩部向量更好地与机器人第一个关节向量平行重合
  shoulder_position: [0.0, -0.17, 1.217]  # [x, y, z] in meters

  # 臂长参数
  arm_lengths:
    upper: 0.2908    # 上臂长度 (meters)
    forearm: 0.2366  # 前臂长度 (meters)

  # 关节限位
  joint_limits:
    - [-7, 7]      # Joint 0: Shoulder_Pitch
    - [-7, 7]     # Joint 1: Shoulder_Roll
    - [-7, 7]    # Joint 2: Shoulder_Yaw
    - [-7, 7]     # Joint 3: Elbow_Pitch
    - [-3.14, 3.14]    # Joint 4: Wrist_Yaw
    - [-3.14, 3.14]    # Joint 5: Wrist_Pitch
    - [-3.14, 3.14]    # Joint 6: Wrist_Roll

  # 关节方向系数（用于调整电机旋转方向）
  # 1 = 正向, -1 = 反向
  # 在真机测试时可以方便地调整每个关节的旋转方向
  joint_directions:
    - -1  # Joint 0: Shoulder_Pitch (反向)
    - 1   # Joint 1: Shoulder_Roll
    - -1  # Joint 2: Shoulder_Yaw (反向)
    - 1  # Joint 3: Elbow_Pitch (反向，让角度映射正确)
    - 1   # Joint 4: Wrist_Yaw
    - 1   # Joint 5: Wrist_Pitch
    - 1   # Joint 6: Wrist_Roll

  # 关节零位偏移（单位：弧度）
  # 用于调整每个关节的零位定义，使人体中立姿态对应机器人零位
  # 计算公式: q_final = q_calculated * joint_directions[i] + joint_offsets[i]
  # 说明：URDF中J0=0°已经对应手臂下垂，不需要额外偏移
  joint_offsets:
    - 0.0      # Joint 0: Shoulder_Pitch (URDF的0°已经是下垂姿态)
    - 0.0      # Joint 1: Shoulder_Roll
    - 0.0      # Joint 2: Shoulder_Yaw
    - 0.0      # Joint 3: Elbow_Pitch
    - 0.0      # Joint 4: Wrist_Yaw
    - 0.0      # Joint 5: Wrist_Pitch
    - 0.0      # Joint 6: Wrist_Roll

# ==========================================
# 坐标系转换
# ==========================================
coordinate_transform:
  # 转换矩阵：Shoulder Frame → Robot Base Frame
  # 用户和机器人同向放置（不是面对面）
  rotation_matrix: [
    [0,  0,  1],  # X_robot = -Z_shoulder (前 = -前，修正镜面对称)
    [0, -1,  0],  # Y_robot = -Y_shoulder (左 = -右)
    [1,  0,  0]   # Z_robot = X_shoulder (上 = 上)
  ]

  # 坐标系说明
  shoulder_frame:
    description: "Vision node output (relative to shoulder)"
    axes:
      x: "up (vertical)"
      y: "right (horizontal)"
      z: "forward (toward camera)"

  robot_base_frame:
    description: "Robot base coordinate system (body_base_link)"
    axes:
      x: "forward"
      y: "left"
      z: "up"

# ==========================================
# 控制参数
# ==========================================
control:
  # IK 策略选择
  # 可选值: "differential" (微分IK), "pink" (Pink优化器), "vist" (VIST卡尔曼滤波)
  ik_strategy: "vist"

  # 微分 IK 参数
  ik_gain: 0.5  # 增益系数 (0-1)，降低以获得更平滑的运动
  ik_damping: 5e-3  # 阻尼系数（避免奇异点，增加以减少跳变）
  ik_max_iter: 100  # 最大迭代次数
  ik_tolerance: 2e-3  # 收敛阈值（米）= 2mm（平衡精度和稳定性）

  # Pink IK 参数（当 ik_strategy="pink" 时使用）
  pink_dt: 0.02  # Pink 求解器时间步长
  pink_wrist_priority: 1.0  # 手腕任务优先级（高）
  pink_elbow_priority: 0.5  # 肘部任务优先级（中）

  # 速度和加速度限制
  # 真机测试安全参数（降低到仿真的 30-40%）
  max_joint_velocity: 0.3      # rad/s (原 0.8，降低到 37.5%)
  max_joint_acceleration: 0.8  # rad/s^2 (原 2.0，降低到 40%)

  # 控制频率
  # ⚠️ 真机注意：move_joint有轨迹规划，不能发送太频繁
  # 建议：10-15Hz 以避免命令冲突和电机过载
  frequency: 10  # Hz (降低到10Hz，避免与move_joint轨迹规划冲突)
  dt: 0.1     # 1/frequency (seconds)

  # 遥操作时长
  duration: 300.0  # seconds (5 minutes)

  # 双目标 IK 权重（用于 differential IK）
  wrist_weight: 1.0   # 手腕权重
  elbow_weight: 0.5   # 肘部权重

# ==========================================
# VIST 卡尔曼滤波参数
# ==========================================
vist_kalman:
  # 启用 VIST 卡尔曼滤波（当 ik_strategy="vist" 时生效）
  enabled: true

  # 仿真参数覆盖模式
  # 当启用时，VIST将使用ParameterOverrideManager中的参数而不是从视觉数据计算
  # 这允许在没有相机输入的情况下测试完整的VIST控制器效果
  simulation_use_parameter_override: true  # 启用参数覆盖模式（仿真专用）

  # 几何解析求解器（肘部约束集成）
  geometric_solver:
    enabled: true  # 启用几何解析求解器 - 追求构型一致性
    # 当启用时，VIST 将使用几何解析解计算臂部配置（q1-q4）
    # 优势：
    # - 解析解速度快（10-100x）
    # - 配置唯一且自然
    # - 符合人体运动学
    # - 直接追求方向向量一致性，末端位置自然对齐
    trust_weight: 2.0  # 几何解析解的信任权重（相对于微分IK）
                       # 通过调整 Q 矩阵实现：Q_arm *= (1.0 / trust_weight)

    # 禁用微分IK（只使用几何求解器）
    disable_differential_ik: true  # 设置为true时，完全禁用微分IK，只使用几何求解器
                                    # 卡尔曼滤波仍然会对几何求解器的输出进行平滑处理

    # 腕部控制模式（4+3解耦策略）
    wrist_control_mode: "constrained_horizontal"  # 可选: "full_dof", "constrained_horizontal", "wrist_locked"

    # 动态腕部控制：在精密插入阶段自动解锁腕部
    enable_dynamic_wrist_unlock: true  # 当α > 0.8时，自动切换到full_dof模式

    # 模式说明：
    # - full_dof: 全自由度欧拉角分解（默认）
    #   * J5-J7通过欧拉角分解自动匹配目标姿态
    #   * 适合通用遥操作任务和精密插入阶段
    # - constrained_horizontal: 约束水平模式（推荐用于桌面操作）
    #   * J5 (Wrist Yaw): 锁定为0（保持水平）
    #   * J6 (Wrist Pitch): 与J4配合约束，保持末端水平于桌面
    #   * J7 (Wrist Roll): 从目标姿态提取手腕旋转
    #   * 适合插入、抓取等桌面操作任务
    #   * 注意：启用dynamic_wrist_unlock后，在精密插入阶段会自动切换到full_dof
    # - wrist_locked: 腕部锁定模式
    #   * J5-J7全部锁定为0
    #   * 只控制臂部配置（J1-J4），末端姿态固定
    #   * 适合简单的位置追踪任务

  # 仿生多任务观测模型（3+4解耦）
  biomimetic_observation:
    enabled: false  # 禁用仿生观测 - 避免与几何求解器冲突
    # 仿生观测使用增量控制 + 微分IK，会与几何求解器的直接求解冲突
    # 几何求解器追求构型一致性，更纯粹、更直接
    # 当启用时，VIST 将人体运动分解为三个独立任务：
    # 1. 手部任务：末端位置追踪
    # 2. 肘部任务：J4角度模仿
    # 3. 臂平面任务：J1-J3姿态模仿
    # 这是VIST的"完全体"：从位置追踪器进化为构型复现器
    elbow_weight: 0.3   # 肘部角度任务权重（0-1）
    swivel_weight: 0.2  # 臂平面任务权重（0-1）
    # 权重说明：
    # - 0.0: 完全忽略该任务，只追踪手部位置
    # - 1.0: 完全模仿人体构型，可能牺牲手部精度
    # - 0.4-0.5: 构型优先，平衡位置精度和构型自然度（当前配置）
    # - 0.2-0.3: 位置优先，构型自然度次之

  # 状态空间维度
  n_joints: 7  # 关节数量
  state_dim: 14  # 状态维度 = 2 * n_joints (位置 + 速度)

  # 过程模型参数（恒速模型）
  process_model:
    dt: 0.02  # 时间步长（秒）

    # 过程噪声协方差 Q（各向异性）
    position_variance: 1e-4  # 关节角度方差
    velocity_variance: 1e-3  # 关节速度方差

    # 肘部约束（防止 7-DoF 肘部漂移）
    elbow_joint_indices: [3]  # 肘部关节索引
    elbow_damping_factor: 0.1  # 肘部方差衰减因子（0-1，越小越稳定）

  # 观测模型参数
  observation_model:
    # 姿态控制开关（李代数支持）
    use_orientation_control: false  # 是否使用姿态控制（默认false，只控制位置）
    # 说明：
    # - false: 只使用位置控制（3D雅可比），适合USB插入等位置主导任务
    # - true: 使用位置+姿态控制（6D雅可比 + 李代数），适合需要精确姿态的任务
    # 当启用时，系统将：
    # 1. 使用李代数 log_SO3 计算姿态误差（避免欧拉角奇异性）
    # 2. 通过完整的 6D 雅可比矩阵转换到关节空间
    # 3. 保持关节空间 Kalman 滤波的优势

    # ==========================================
    # 多源融合方法选择
    # ==========================================
    # 可选值: "standard" (标准卡尔曼) 或 "information" (信息滤波器)
    fusion_method: "standard"  # 默认使用标准卡尔曼滤波
    # 说明：
    # - standard: 观测向量堆叠 z = [z_human; z_virtual]
    # - information: 信息滤波器形式 R_eff = (R_h^{-1} + R_v^{-1})^{-1}
    #                合成观测 z_syn = R_eff(R_h^{-1}z_h + R_v^{-1}z_v)

    # 人类指令观测噪声 R_human（意图驱动）
    # 论文3.0版本：指数形式 R_human(α) = R_base × exp(λα)
    human_base_variance: 1e-2  # 基础噪声水平 R_base
    human_max_variance: 1e-1   # 最大噪声（自由移动时，仅用于兼容旧版本）
    human_lambda: 3.0          # 指数增长系数 λ（论文3.0版本新增）

    # 虚拟引导观测噪声 R_virtual（微分 IK）
    # 论文3.0版本：反比例形式 R_virtual(α) = R_min/(α + ε) + γ_c × conflict
    virtual_base_variance: 1e-4  # 基础噪声水平（仅用于兼容旧版本）
    virtual_min_variance: 1e-3   # 最小噪声 R_min（论文3.0版本）
    conflict_gain: 1.0           # 冲突增益 γ_c（论文3.0版本新增）

    # 微分 IK 参数
    differential_ik_damping: 5e-3  # 雅可比伪逆阻尼

  # 意图检测参数
  intent_detection:
    # 意图因子 α ∈ [0, 1]
    # α → 0: 自由移动模式（强力去噪）
    # α → 1: 精密操作模式（磁吸引导）

    # ==========================================
    # 论文英文草稿v1.0完整实现 (Eq. 2-5)
    # ==========================================
    # α_geo = exp(-1/2 ξ_err^T W_task ξ_err)  [几何势能]
    # α_vel = 1/(1 + β||ξ_vel||²)             [运动能量]
    # α_dir = 1/2(1 + cos(θ))                 [方向对齐]
    # α_k = σ(w_g·α_geo + w_v·α_vel) · (α_dir)^η  [意图因子]

    # 任务流形度量张量 W_task (对角矩阵)
    # 对不同维度赋予不同权重 [x, y, z, rx, ry, rz]
    w_task: [10.0, 10.0, 10.0, 1.0, 1.0, 1.0]  # 位置权重高，姿态权重低

    # 运动能量参数 β (Eq. 3)
    # α_vel = 1/(1 + β||ξ_vel||²)
    alpha_beta: 1.0  # 速度敏感度系数

    # 意图因子融合权重 (Eq. 5)
    # α_k = σ(w_g·α_geo + w_v·α_vel) · (α_dir)^η
    w_geo: 0.5  # 几何势能权重
    w_vel: 0.5  # 运动能量权重
    alpha_alignment_power: 2.0  # 方向对齐的指数η

    # 意图平滑
    intent_smoothing: 0.9  # EMA 平滑系数（0-1）

    # ==========================================
    # 旧版参数（保留用于向后兼容）
    # ==========================================
    alpha_computation_method: "paper"  # 已废弃，现在总是使用论文方法
    distance_threshold: 0.1
    velocity_threshold: 0.05
    sigmoid_k: 10.0
    sigma_d: 0.1
    beta_v: 20.0
    alpha_weights:
      distance: 0.3
      velocity: 0.3
      alignment: 0.4

  # 初始化参数
  initialization:
    initial_state_variance: 1e-2  # 初始状态不确定性
    initial_velocity_variance: 1e-3  # 初始速度不确定性

# ==========================================
# 滤波参数
# ==========================================
filtering:
  # Mapper 层滤波开关
  # true: 在 Mapper 中应用滤波（调试模式，方便可视化）
  # false: 透传原始数据给控制节点（生产模式，由 VIST 核心算法处理）
  enable_mapper_filter: true

  # Mapper 滤波器类型
  # 可选值: "ema" (指数移动平均) 或 "oneeuro" (One Euro Filter)
  mapper_filter_type: "oneeuro"

  # EMA 滤波参数
  ema_alpha: 0.5  # 滤波系数 (0=最大平滑, 1=无滤波)

  # One Euro Filter 参数
  oneeuro_min_cutoff: 0.1  # 最小截止频率（降低以增强滤波）
  oneeuro_beta: 0.001      # 速度系数（降低以减少对速度变化的敏感度）
  oneeuro_d_cutoff: 1.0    # 导数截止频率

  # 控制节点滤波（VIST 核心算法）
  # 这里可以配置 Kalman Filter 或其他状态估计器参数
  enable_control_filter: true
  control_filter_type: "oneeuro"  # 控制节点使用的滤波器

# ==========================================
# 网络参数
# ==========================================
network:
  udp_host: "0.0.0.0"  # 绑定地址（0.0.0.0 = 所有接口）
  udp_ip: "127.0.0.1"  # 发送地址
  udp_port: 6001
  buffer_size: 65536

# ==========================================
# 视觉参数
# ==========================================
vision:
  # 相机参数
  width: 640
  height: 480
  fps: 30

  # 坐标缩放
  scale: 1.0

  # 深度融合
  use_realsense_depth: true
  depth_valid_threshold: 0.001  # meters

# ==========================================
# 安全参数
# ==========================================
safety:
  # 数据超时
  max_data_timeout: 50  # frames (1秒 @ 50Hz)

  # 位置限制
  max_distance_from_shoulder: 0.7  # meters (1.2 * arm_length)

  # 调试模式
  debug_mode: false
  debug_print_interval: 30  # frames

# ==========================================
# 真机驱动参数
# ==========================================
hardware:
  # 机器人控制器 IP 地址
  robot_ip: "192.168.10.21"

  # 使用哪个手臂
  arm_side: "right"  # "left" 或 "right"

  # 关节映射关系（URDF ↔ SDK）
  joint_mapping:
    urdf_to_sdk: [0, 1, 2, 3, 4, 5, 6]
    sdk_to_urdf: [0, 1, 2, 3, 4, 5, 6]

  # 关节符号翻转（按 URDF 顺序）
  joint_sign_flip: [false, true, true, false, true, false, false]

  # SDK 运动控制参数
  # 真机运动参数（针对move_joint优化）
  # 注意：由于joint_follow有bug，只能使用move_joint
  # move_joint会做轨迹规划，所以需要提高速度以减少延迟
  # ⚠️ 安全参数：降低速度和加速度以防止电机过载
  move_joint_speed: 0.1      # 关节运动速度 (rad/s) - 降低到安全值
  move_joint_accel: 0.1      # 关节运动加速度 (rad/s²) - 降低到安全值
  move_joint_block: false    # 是否阻塞等待运动完成

  # 关节跟随模式（用于遥操作）
  joint_follow_mode: false    # true=高跟随模式（低延迟），false=低跟随模式（平滑）

  # 连接超时
  connection_timeout: 10.0   # 秒

  # 状态读取重试次数
  state_read_retries: 5
  state_read_interval: 0.5   # 秒

# ==========================================
# 可视化参数
# ==========================================
visualization:
  # 是否启用可视化
  enable: false

  # MeshCat 服务器地址
  meshcat_url: "tcp://127.0.0.1:7000"

  # 更新频率
  update_rate: 30  # Hz

  # 轨迹点数量
  max_trajectory_points: 100

# ==========================================
# 增强功能配置（新增 2026-02-09）
# ==========================================
enhanced_features:
  # 是否启用意图检测和冲突检测
  # true: 启用增强模式（5阶段状态机 + 冲突检测 + 柔顺接管）
  # false: 基础模式（直接运动映射，向后兼容）
  enable_intent_detection: false

  # 是否启用目标检测（AprilTag/ArUco）
  enable_target_detection: false

  # 目标检测器类型
  target_detector_type: "apriltag"  # "apriltag" 或 "aruco"

  # 最大速度限制（用于简化安全监控器）
  max_velocity: 0.10  # 10 cm/s

