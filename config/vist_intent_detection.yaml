# VIST Intent Detection Configuration
# 意图检测配置文件

intent_detection:
  # 阶段转换阈值
  align_distance_threshold: 0.05  # 5cm，进入视觉导纳阶段
  insertion_alignment_threshold: 0.002  # 2mm，开始约束插入

  # 修正/接管检测参数
  correction:
    max_distance: 0.02  # 2cm，小幅度移动
    velocity_threshold: 0.01  # 1cm/s，慢速度
    max_acceleration: 0.05  # 低加速度（平稳移动）

  # 冲突检测参数（β term）
  conflict:
    angle_threshold_deg: 30  # 30度，夹角阈值
    velocity_threshold: 0.005  # 0.5cm/s，速度阈值
    max_velocity: 0.05  # 5cm/s，最大速度（用于归一化）

  # 插入控制参数
  insertion:
    target_depth: 0.015  # 15mm（USB Type-A 标准）
    completion_threshold: 0.95  # 95% 深度即认为完成

    # 速度控制（分段）
    velocity_control:
      fast_distance: 0.010  # > 10mm
      fast_velocity: 0.01  # 1cm/s

      medium_distance: 0.005  # 5-10mm
      medium_velocity: 0.005  # 0.5cm/s

      slow_distance: 0.0  # < 5mm
      slow_velocity: 0.002  # 0.2cm/s

  # 松手检测参数
  hand_release:
    stationary_threshold: 0.001  # 1mm/s，静止阈值
    moving_away_velocity: 0.05  # 5cm/s，远离速度
    moving_away_acceleration: 0.1  # 远离加速度

  # 意图因子配置
  alpha_values:
    approaching: 0.0  # 接近阶段（人类主导）
    visual_admittance: 1.0  # 视觉导纳阶段（算法主导）
    correction_override: 0.2  # 修正/接管阶段（人类接管，保留 20% 算法辅助）
    constrained_insertion: 1.0  # 约束插入阶段（算法主导）
    release: 0.0  # 释放阶段（人类主导）

  # 采样频率
  sampling_frequency: 30  # Hz

  # 调试选项
  debug:
    enable_logging: true
    log_conflict_detection: true
    log_state_transitions: true
