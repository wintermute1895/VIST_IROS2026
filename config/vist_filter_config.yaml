vist_filter_node:
  ros__parameters:
    arm_side: left
    ema_alpha: 0.3
    enable_alignment_factor: false
    enable_conflict_detection: false
    enable_distance_factor: false
    enable_performance_monitoring: true
    enable_velocity_factor: false
    exo_left_topic: /left_arm_joint_control
    exo_right_topic: /right_arm_joint_control
    filter_type: one_euro
    filtered_left_topic: /filtered_left_joint_control
    filtered_right_topic: /filtered_right_joint_control
    one_euro_beta: 0.007
    one_euro_min_cutoff: 1.0
    output_freq_hz: 80.0
    performance_topic: /vist_performance
    vision_left_topic: /vision_left_joint_control
    vision_right_topic: /vision_right_joint_control
    vist_config_path: config/system_config.yaml
