# VIST 消融实验配置文件（修正版）
# 用于对比不同滤波器的性能
#
# ⚠️ 重要说明：
# 本配置文件只替换 VIST 核心的卡尔曼滤波器，不影响其他层的滤波器
# 系统中有多层滤波器：
# 1. Mapper 层滤波器（filtering.mapper_filter_type）- 不受影响
# 2. VIST 卡尔曼滤波器（vist_kalman.enabled）- 消融实验替换此层
# 3. 安全控制器（SafeRobotController）- 不受影响

# ==========================================
# 实验 1: 无滤波器（对照组）
# ==========================================
experiment_1_no_filter:
  name: "No Filter (Baseline)"
  description: "禁用 VIST 卡尔曼滤波，直接使用 IK 求解结果"

  # VIST 卡尔曼滤波器配置（消融实验专用）
  vist_kalman:
    enabled: false  # 禁用 VIST 卡尔曼滤波
    ablation_filter_type: "none"  # 使用无滤波器替代

  # 继承主配置的其他参数
  inherit_from: "system_config.yaml"

# ==========================================
# 实验 2: 移动平均滤波器
# ==========================================
experiment_2_moving_average:
  name: "Moving Average Filter"
  description: "使用简单的移动平均滤波器替代 VIST 卡尔曼滤波"

  # VIST 卡尔曼滤波器配置
  vist_kalman:
    enabled: false  # 禁用 VIST 卡尔曼滤波
    ablation_filter_type: "moving_average"
    ablation_filter_params:
      window_size: 5  # 窗口大小

  inherit_from: "system_config.yaml"

# ==========================================
# 实验 3: One-Euro 滤波器（弱滤波）
# ==========================================
experiment_3_one_euro_weak:
  name: "One-Euro Filter (Weak)"
  description: "使用 One-Euro 滤波器（弱滤波配置）替代 VIST 卡尔曼滤波"

  # VIST 卡尔曼滤波器配置
  vist_kalman:
    enabled: false  # 禁用 VIST 卡尔曼滤波
    ablation_filter_type: "one_euro"
    ablation_filter_params:
      min_cutoff: 0.5   # 最小截止频率（Hz）
      beta: 0.001       # 速度系数（小 = 弱滤波）
      d_cutoff: 1.0     # 速度滤波截止频率（Hz）

  inherit_from: "system_config.yaml"

# ==========================================
# 实验 4: One-Euro 滤波器（强滤波）
# ==========================================
experiment_4_one_euro_strong:
  name: "One-Euro Filter (Strong)"
  description: "使用 One-Euro 滤波器（强滤波配置）替代 VIST 卡尔曼滤波"

  # VIST 卡尔曼滤波器配置
  vist_kalman:
    enabled: false  # 禁用 VIST 卡尔曼滤波
    ablation_filter_type: "one_euro"
    ablation_filter_params:
      min_cutoff: 2.0   # 最小截止频率（Hz）
      beta: 0.01        # 速度系数（大 = 强滤波）
      d_cutoff: 1.0     # 速度滤波截止频率（Hz）

  inherit_from: "system_config.yaml"

# ==========================================
# 实验 5: 自适应卡尔曼滤波器（VIST 完整版）
# ==========================================
experiment_5_adaptive_kalman:
  name: "Adaptive Kalman Filter (VIST)"
  description: "VIST 的自适应卡尔曼滤波器（完整版，包含意图驱动）"

  # VIST 卡尔曼滤波器配置
  vist_kalman:
    enabled: true  # 启用 VIST 卡尔曼滤波（原生实现）
    ablation_filter_type: "adaptive_kalman"  # 使用 VIST 原生的自适应卡尔曼滤波

  inherit_from: "system_config.yaml"

# ==========================================
# 消融实验设置
# ==========================================
ablation_study:
  # 实验列表（按顺序执行）
  experiments:
    - experiment_1_no_filter
    - experiment_2_moving_average
    - experiment_3_one_euro_weak
    - experiment_4_one_euro_strong
    - experiment_5_adaptive_kalman

  # 每个实验的重复次数
  repetitions: 20

  # 使用录制的数据进行回放测试
  use_recorded_data: true
  recorded_data_file: "data/recordings/ablation_standard.jsonl"

  # 评估指标
  metrics:
    - "success_rate"           # 成功率
    - "completion_time"        # 完成时间
    - "normalized_jerk"        # 归一化 Jerk
    - "tracking_error"         # 跟踪误差
    - "smoothness"             # 平滑度（SPARC）
    - "dtw_distance"           # 动态时间规整距离
    - "pca_task_axis_ratio"    # 任务轴 PCA 占比
    - "psd_high_freq_power"    # 高频能量（>5Hz）

  # 输出目录
  output_dir: "logs/ablation_study"

  # 是否生成对比图表
  generate_plots: true