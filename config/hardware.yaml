# config/hardware.yaml

camera:
  device_id: 0           # 如果是 USB 相机通常是 0 或 2，插拔一下确认 /dev/video*
  width: 640
  height: 480
  fps: 30
  type: "webcam"         # 如果用 Realsense 建议改成 "realsense"

calibration:
  # 手眼标定矩阵 (占位符)
  # 运行 calibration.py 后，脚本会自动把算好的值填到这里，不用手动改
  position: [0.3, 0.0, 0.5]
  rotation: [0, 0, 0, 1]

arm:
  # 统一使用 robot 字段，删除多余的 arm 字段
  type: "linker"         # 明确是 LinkerArm
  ip: "192.168.10.21"    # 必须和你 ping 通的 IP 一致
  control_freq: 50       # 50Hz 是比较安全的控制频率
  side: "right"      # SDK 需要知道是左臂还是右臂
  dof: 7

  # URDF配置：选择使用哪个URDF模型
  urdf: "right_arm_only.urdf"  # 只包含右臂7自由度的简化模型
  # urdf: "robot.urdf"         # 完整34自由度人形机器人模型

  # 安全限制 (对应我们刚才写的 RealArmDriver)
  max_velocity: 2.0      # rad/s，超过这个速度软件会自动限速
  joint_ids: [1, 2, 3, 4, 5, 6, 7] # 仅作记录，Linker SDK 内部封装好了

vision:
  aruco_dict: "DICT_4X4_50" # 确保你打印的和这个字典一致
  aruco_size: 0.035      # ⚠️【关键】请用游标卡尺测量打印出的 Marker 黑色边框宽度 (单位:米)
                         # 比如打印在 A4 纸角落通常比较小，可能是 0.03~0.05