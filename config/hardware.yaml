# config/hardware.yaml

camera:
  device_id: 0           # 或者是 /dev/video0，或者是 RealSense 的序列号
  width: 640
  height: 480
  fps: 30
  type: "webcam"         # "webcam" 或 "realsense"

calibration:
  # 相机坐标系到机器人基座坐标系的变换矩阵 (T_base_cam)
  # 先写个单位矩阵占位，后续用 calibrate_system.py 覆盖
  position: [0.5, 0.0, 0.5]  # x, y, z (meters)
  rotation: [0, 0, 0, 1]     # x, y, z, w (quaternion)

robot:
  ip: "192.168.1.100"
  type: "realman"        # 你的机械臂型号
  control_freq: 50       # Hz

vision:
  aruco_dict: "DICT_4X4_50"
  aruco_size: 0.05       # Marker边长 (meters)，用于位姿估计