# 视觉控制测试配置
# 添加到 config/system_config.yaml 的末尾

# ============================================
# ROS2发布配置（用于仿真）
# ============================================
simulation_enable_ros2_publish: true  # 启用ROS2发布

# ============================================
# 简单滤波器配置
# ============================================
enable_simple_filter: true  # 启用简单EMA滤波
simple_filter_alpha: 0.3    # EMA平滑因子 (0-1)
                            # 越小越平滑，但延迟越大
                            # 推荐值: 0.2-0.4

# ============================================
# 高频发布配置
# ============================================
high_freq_publish_enabled: true  # 启用250Hz高频发布
high_freq_interpolation: "linear"  # 插值方法: "linear" 或 "cubic"

# ============================================
# 说明
# ============================================
# 简单滤波器 (EMA - 指数移动平均):
#   - 原理: q_filtered = α * q_new + (1-α) * q_old
#   - 优点: 计算简单，实时性好
#   - 缺点: 会引入延迟
#   - 适用: 快速测试和baseline对比
#
# α值选择:
#   - 0.1-0.2: 强平滑，高延迟（~100ms）
#   - 0.3-0.4: 中等平滑，中等延迟（~50ms）
#   - 0.5-0.7: 弱平滑，低延迟（~20ms）
#   - 0.8-1.0: 几乎无平滑
#
# 高频发布:
#   - 主循环: 20-30 Hz (计算IK)
#   - 发布线程: 250 Hz (插值发布)
#   - 插值方法:
#     * linear: 快速，低延迟
#     * cubic: 更平滑，略有延迟